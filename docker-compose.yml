# docker-compose — Laboratorio Snyk (Task Manager simple)
#   backend  → API .NET 8 (SQLite en volumen) — http://localhost:8081
#   frontend → SPA React/nginx — http://localhost:3000 (proxy /api → backend)
#
# Uso: docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: snyk-lab-backend
    ports:
      - "8081:8080"
    volumes:
      - sqlite-data:/app/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  frontend:
    build:
      context: .
      dockerfile: SecureDevOps.Web/Dockerfile
      args:
        VITE_API_URL: "/api"
    image: snyk-lab-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  sqlite-data: