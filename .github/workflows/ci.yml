# Fase 12: CI/CD con Snyk.

# Workflow CI de referencia con Snyk (Open Source + Code + IaC) en GitHub Actions.
# El token se referencia SOLO vía GitHub Secret (SNYK_TOKEN); nunca literal en el YAML.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: SecureDevOps.Web/package-lock.json

      - name: Backend build
        run: dotnet build SecureDevOps.API/SecureDevOps.API.csproj --configuration Release

      - name: Backend tests
        run: dotnet test tests/SecureDevOps.API.Tests/SecureDevOps.API.Tests.csproj --configuration Release

      - name: Frontend build
        working-directory: SecureDevOps.Web
        run: npm ci && npm run build

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---------- Snyk Open Source ----------
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --file=SecureDevOps.Web/package-lock.json

      # ---------- Snyk Code ----------
      - name: Run Snyk Code test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG: ${{ secrets.SNYK_ORG }}
        with:
          command: code
          args: --sarif-file-output=snyk-code.sarif

      # ---------- Snyk IaC ----------
      - name: Run Snyk IaC test
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: infrastructure/terraform

      # ---------- Upload SARIF (GitHub Advanced Security) ----------
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-code.sarif

  snyk-container:
    name: Snyk Container
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -f docker/Dockerfile.backend -t securedevops-api:ci .

      - name: Snyk Container test
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: securedevops-api:ci
          args: --file=docker/Dockerfile.backend